<div class="container">
    <app-action-configuration
        *ngIf="currentAction"
        [action]="currentAction"
    ></app-action-configuration>

    <div class="action-list-section">
        <div class="action-list-buttons">
            <app-fancy-button icon="🗑️" label=""></app-fancy-button>
            <app-fancy-button icon="➕" label=""></app-fancy-button>
        </div>

        <div class="action-list-container">
            <div class="action-list">
                <div class="action-entry" *ngFor="let x of [1, 2, 3, 4, 5, 6, 7, 8, 9]; let i = index">
                    {{i + 1}}. connect websocket
                </div>
            </div>

            <div class="floating-action-list-buttons">
                <app-fancy-button icon="⬆️" label=""></app-fancy-button>
                <app-fancy-button icon="⬇️" label=""></app-fancy-button>
            </div>
        </div>
    </div>
</div>
